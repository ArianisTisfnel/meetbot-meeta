name: meetbot-demo

# 本機開發用基礎設施：Postgres + MinIO。
#
# ⚠️ 這是 demo 專用堆疊（2026-08-20 由 df3eba7 切出）：
#   compose project 名、容器名、對外 port、volume 全部與主 repo 分開，
#   兩邊可以同時開著互不干擾，也不會共用同一份資料庫 schema。
# Node backend/frontend 仍在 host 上跑 npm run dev，不進容器。
#
# 連線字串分兩種，不要混用：
#   - host 端（backend/.env、npx prisma 等）：走對外 published port，例如 localhost:5433
#   - container 對 container：走 compose 網路內的服務名稱，例如 postgres:5432
#
# Postgres 對外 port 用 5433（非預設 5432）：本機常見已有原生安裝的 Postgres 服務佔用 5432，
# 用不同 port 避免跟 host 上其他 Postgres 衝突（連線被導去別的資料庫、驗證失敗）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: meetbot-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetbot
      POSTGRES_PASSWORD: meetbot_local_dev
      POSTGRES_DB: meetbot
    ports:
      - "5434:5432" # demo 專用（主 repo 用 5433）
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetbot -d meetbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: meetbot-demo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meetbot
      MINIO_ROOT_PASSWORD: meetbot_local_dev
    ports:
      - "19002:9000" # S3 API — 對應 backend/.env 的 S3_ENDPOINT（demo 專用，主 repo 用 9000）
      - "19003:9001" # Web console（demo 專用，主 repo 用 9001）
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: meetbot-demo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 meetbot meetbot_local_dev &&
      mc mb --ignore-existing local/meeting-materials &&
      mc anonymous set none local/meeting-materials"
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meetbot-demo-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: meetbot@local.dev
      PGADMIN_DEFAULT_PASSWORD: meetbot_local_dev
      # 關掉登入時的 master password 二次確認，本機開發用不需要
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5051:80" # 網頁版 pgAdmin — http://localhost:5051（demo 專用）
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # 預先帶入連線設定（host/port/db/user），組員開起來就有現成的 server，
      # 只需要在第一次連線時輸入密碼（meetbot_local_dev）。唯讀掛載，避免容器改到原始檔。
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  minio-data:
  pgadmin-data:
