name: meetbot

# 本機開發用基礎設施：Postgres + MinIO（取代 Supabase Storage）+ vexa-lite。
# Node backend/frontend 仍在 host 上跑 npm run dev，不進容器。
#
# 連線字串分兩種，不要混用：
#   - host 端（backend/.env、npx prisma 等）：走對外 published port，例如 localhost:5433
#   - container 對 container（vexa-lite → postgres）：走 compose 網路內的服務名稱，例如 postgres:5432
#
# Postgres 對外 port 用 5433（非預設 5432）：本機常見已有原生安裝的 Postgres 服務佔用 5432，
# 用不同 port 避免跟 host 上其他 Postgres 衝突（連線被導去別的資料庫、驗證失敗）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: meetbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetbot
      POSTGRES_PASSWORD: meetbot_local_dev
      POSTGRES_DB: meetbot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetbot -d meetbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: meetbot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meetbot
      MINIO_ROOT_PASSWORD: meetbot_local_dev
    ports:
      - "9000:9000" # S3 API — 對應 backend/.env 的 S3_ENDPOINT
      - "9001:9001" # Web console（選用，方便肉眼檢查上傳的檔案）
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: meetbot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 meetbot meetbot_local_dev &&
      mc mb --ignore-existing local/meeting-materials &&
      mc anonymous set none local/meeting-materials"
    restart: "no"

  vexa-init-db:
    image: vexaai/vexa-lite:latest
    container_name: meetbot-vexa-init-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # vexa-lite 讀的是拆開的 DB_* 變數，不是單一 DATABASE_URL（見 admin_models/database.py）。
      # 值是 container 網路位址，不是 backend/.env 裡 host 端用的 localhost:5433。
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: meetbot
      DB_USER: meetbot
      DB_PASSWORD: meetbot_local_dev
      DB_SSL_MODE: disable
    volumes:
      - vexa-init-marker:/data
    entrypoint: ["/bin/sh", "-c"]
    # marker 檔守門：start.ps1 每次啟動都會 docker compose up -d，
    # 若 init_db() 對已存在的表重跑會出錯，沒有這層防護會導致每次開發都失敗。
    command:
      - >
        test -f /data/.initialized && echo "already initialized, skipping" || (
        python3 -c "import asyncio; from admin_models.database import init_db; asyncio.run(init_db())" &&
        python3 -c "import asyncio; from meeting_api.database import init_db; asyncio.run(init_db())" &&
        touch /data/.initialized
        )
    restart: "no"

  vexa-lite:
    image: vexaai/vexa-lite:latest
    container_name: meetbot-vexa-lite
    restart: unless-stopped
    depends_on:
      vexa-init-db:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      # 覆蓋：container 網路位址。entrypoint script 讀組好的 DATABASE_URL 做連線檢查，
      # Python 模組（admin_models/meeting_api）讀拆開的 DB_*；兩套都要蓋成 container 網路位址，
      # 不能用 env_file 帶進來、host 端用的 localhost:5433。
      DATABASE_URL: postgresql://meetbot:meetbot_local_dev@postgres:5432/meetbot
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: meetbot
      DB_USER: meetbot
      DB_PASSWORD: meetbot_local_dev
      DB_SSL_MODE: disable
      VEXA_API_URL: http://localhost:8056
      ADMIN_API_URL: http://localhost:8057
      # 這個專案目前 BOT_PRIMARY_PROVIDER=recall，vexa-lite 只用來維持 public.users/api_tokens
      # 與 login 流程，不需要真的能轉錄；entrypoint 預設會送測試音檔驗證轉錄服務，沒有可用
      # token/額度時會直接 exit 1，跳過它才能讓容器起來。
      SKIP_TRANSCRIPTION_CHECK: "true"
    ports:
      - "8056:8056"
      - "8057:8057"
    volumes:
      - vexa-recordings:/var/lib/vexa/recordings

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meetbot-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: meetbot@local.dev
      PGADMIN_DEFAULT_PASSWORD: meetbot_local_dev
      # 關掉登入時的 master password 二次確認，本機開發用不需要
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80" # 網頁版 pgAdmin — http://localhost:5050
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # 預先帶入連線設定（host/port/db/user），組員開起來就有現成的 server，
      # 只需要在第一次連線時輸入密碼（meetbot_local_dev）。唯讀掛載，避免容器改到原始檔。
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  minio-data:
  vexa-recordings:
  vexa-init-marker:
  pgadmin-data:
